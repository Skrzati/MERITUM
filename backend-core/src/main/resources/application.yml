server:
  port: ${PORT:8080}
spring:
  application:
    name: backend-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oceny}
    username: ${DB_USER:oceny}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  gotenberg-url: ${GOTENBERG_URL:http://localhost:3001/forms/chromium/convert/html}
