server:
  port: ${PORT:8080}
spring:
  application:
    name: backend-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oceny}
    username: ${DB_USER:oceny}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # SMTP — w demo Mailpit (infra/docker-compose.yml); wysyłka tylko przy MAIL_ENABLED=true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  gotenberg-url: ${GOTENBERG_URL:http://localhost:3001/forms/chromium/convert/html}
  ai-gateway-url: ${AI_GATEWAY_URL:http://localhost:8000}
  jwt:
    # min. 32 bajty; pusty => losowy klucz na czas życia procesu (tylko demo)
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  auth:
    # nagłówek X-Demo-User-Id (testy/Swagger); w produkcji wyłączyć
    demo-header-enabled: ${DEMO_HEADER_ENABLED:true}
    # symulowany Węzeł Krajowy (POST /api/auth/gov-login) — tylko demo; w produkcji login.gov.pl / OIDC / SAML
    gov-login-enabled: ${GOV_LOGIN_ENABLED:false}
    # koszt BCrypt dla kont lokalnych (tryb Mały Urząd)
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  retention:
    # dane pomocnicze (notatki robocze, ankiety) czyszczone po zamknięciu cyklu + karencja; arkusze — część B akt
    purge-enabled: ${RETENTION_PURGE_ENABLED:false}
    purge-cron: ${RETENTION_PURGE_CRON:0 30 2 * * *}
    working-notes-grace-days: ${RETENTION_GRACE_DAYS:30}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:meritum@kprm-demo.gov.pl}
  stats:
    k-anonymity: ${STATS_K_ANONYMITY:5}
  cors:
    # wzorce originów (allowedOriginPatterns), po przecinku
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    login-per-window: ${RATE_LIMIT_LOGIN_PER_WINDOW:30}
    ai-per-window: ${RATE_LIMIT_AI_PER_WINDOW:60}
    # backend stoi za proxy Next.js — adres klienta z X-Forwarded-For; false, jeśli backend jest wystawiony bezpośrednio
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:true}
  ai:
    max-request-bytes: ${AI_MAX_REQUEST_BYTES:65536}
    audit-prompt-max-chars: ${AI_AUDIT_PROMPT_MAX_CHARS:4000}
